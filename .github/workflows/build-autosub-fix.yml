name: Build AutoSub large-row fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-autosub-fix.yml'
      - 'patch_queue_store.py'
      - 'QueueStoreLargeRowTest.java'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout build harness
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;27.0.12077973' \
            'cmake;3.22.1'

      - name: Checkout exact upstream v1.5 source
        shell: bash
        run: |
          git clone --branch v1.5 --depth 1 https://github.com/Serkali-sudo/auto-subtitle-generator.git autosub
          cd autosub
          ACTUAL_COMMIT="$(git rev-parse HEAD)"
          EXPECTED_COMMIT='a1d8cd132bbe75464d0c8a07e2f75ea7e91152d2'
          echo "Upstream commit: $ACTUAL_COMMIT"
          test "$ACTUAL_COMMIT" = "$EXPECTED_COMMIT"

      - name: Apply minimal QueueStore fix
        shell: bash
        run: |
          cp patch_queue_store.py autosub/
          cd autosub
          python3 patch_queue_store.py
          rm patch_queue_store.py

      - name: Install regression test source
        shell: bash
        run: |
          mkdir -p autosub/app/src/androidTest/java/com/serhat/autosub/queue
          cp QueueStoreLargeRowTest.java autosub/app/src/androidTest/java/com/serhat/autosub/queue/QueueStoreLargeRowTest.java

      - name: Static safety checks
        shell: bash
        run: |
          cd autosub
          FILE='app/src/main/java/com/serhat/autosub/queue/QueueStore.java'
          grep -F 'query(TABLE, ITEM_COLUMNS' "$FILE"
          grep -F 'loadSubtitlesChunked(id)' "$FILE"
          grep -F 'SELECT substr(subtitles_json, ?, ?)' "$FILE"
          if grep -F 'getColumnIndexOrThrow("subtitles_json")' "$FILE"; then
            echo 'Unsafe direct CursorWindow subtitle read still present' >&2
            exit 1
          fi
          git diff --check
          git diff -- "$FILE"

      - name: Host SQLite large-Unicode-payload regression test
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import sqlite3

          CHUNK = 64 * 1024
          # More than 10 MB as UTF-8, with CJK + supplementary Unicode characters.
          huge_text = "字幕TEST😄" * 900_000
          payload = json.dumps([{
              "number": 1,
              "start": "00:00:00,000",
              "end": "00:00:05,000",
              "text": huge_text,
              "translationText": "中文翻译😄",
              "words": [{"word": "字幕", "startMs": 0, "endMs": 300, "confidence": 0.99}],
          }], ensure_ascii=False, separators=(",", ":"))

          con = sqlite3.connect(":memory:")
          con.execute("CREATE TABLE queue_items (id INTEGER PRIMARY KEY, display_name TEXT, subtitles_json TEXT, created_at INTEGER)")
          con.execute("INSERT INTO queue_items VALUES (?, ?, ?, ?)", (1, "large-row-test.mp4", payload, 1))

          # Mirror the fixed metadata query: the huge JSON cell is deliberately absent.
          metadata = con.execute("SELECT id, display_name FROM queue_items ORDER BY created_at DESC").fetchall()
          assert metadata == [(1, "large-row-test.mp4")]

          pieces = []
          offset = 1  # SQLite substr() is 1-based for TEXT.
          while True:
              row = con.execute(
                  "SELECT substr(subtitles_json, ?, ?) FROM queue_items WHERE id = ?",
                  (offset, CHUNK, 1),
              ).fetchone()
              assert row is not None
              chunk = row[0]
              if not chunk:
                  break
              assert len(chunk) <= CHUNK
              pieces.append(chunk)
              offset += CHUNK

          rebuilt = "".join(pieces)
          assert rebuilt == payload
          parsed = json.loads(rebuilt)
          assert parsed[0]["text"] == huge_text
          assert parsed[0]["translationText"] == "中文翻译😄"
          assert parsed[0]["words"][0]["confidence"] == 0.99
          print(f"PASS: {len(payload.encode('utf-8')):,} UTF-8 bytes reconstructed in {len(pieces)} SQLite chunks")
          PY

      - name: Build release APK
        shell: bash
        run: |
          cd autosub
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Run existing JVM unit tests
        shell: bash
        run: |
          cd autosub
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Compile Android large-row regression test
        shell: bash
        run: |
          cd autosub
          # Compile/package the instrumentation test to catch API/type errors. The
          # hosted Linux runner has no KVM, so actually booting its emulator is not a
          # reliable correctness gate (the previous run reached Android before its
          # package service was ready). Device execution is reserved for the phone.
          ./gradlew --no-daemon --stacktrace :app:assembleDebugAndroidTest

      - name: Sign and verify arm64 release APK
        shell: bash
        run: |
          set -euo pipefail
          cd autosub
          UNSIGNED="$(find app/build/outputs/apk -type f -name '*arm64-v8a*release*.apk' | head -n 1)"
          if [ -z "$UNSIGNED" ]; then
            echo 'arm64 release APK not found' >&2
            find app/build/outputs/apk -type f -name '*.apk' -print || true
            exit 1
          fi
          echo "Unsigned APK: $UNSIGNED"

          keytool -genkeypair -noprompt \
            -keystore /tmp/autosub-fix.jks \
            -storepass autosubfix-build-only \
            -keypass autosubfix-build-only \
            -alias autosubfix \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=AutoSub Local Fix,OU=Local Build,O=Local Build,L=Local,ST=Local,C=US'

          ZIPALIGN="$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt"
          "$ZIPALIGN" -p -f 4 "$UNSIGNED" AutoSub-v1.5-large-row-fix-arm64-aligned.apk
          "$APKSIGNER" sign \
            --ks /tmp/autosub-fix.jks \
            --ks-pass pass:autosubfix-build-only \
            --key-pass pass:autosubfix-build-only \
            --out AutoSub-v1.5-large-row-fix-arm64.apk \
            AutoSub-v1.5-large-row-fix-arm64-aligned.apk

          "$APKSIGNER" verify --verbose --print-certs AutoSub-v1.5-large-row-fix-arm64.apk | tee apk-signature.txt
          "$AAPT" dump badging AutoSub-v1.5-large-row-fix-arm64.apk | head -n 5 | tee apk-badging.txt
          grep -F "package: name='com.serhat.autosub' versionCode='6' versionName='1.5'" apk-badging.txt
          unzip -l AutoSub-v1.5-large-row-fix-arm64.apk | grep -F 'lib/arm64-v8a/' | head -n 10
          sha256sum AutoSub-v1.5-large-row-fix-arm64.apk | tee AutoSub-v1.5-large-row-fix-arm64.apk.sha256

          {
            echo 'Source tag: v1.5'
            echo 'Source commit: a1d8cd132bbe75464d0c8a07e2f75ea7e91152d2'
            echo 'Patch scope: QueueStore.java only'
            echo 'Database schema/version changed: no'
            echo 'Recognition/translation/export code changed: no'
            echo
            cat AutoSub-v1.5-large-row-fix-arm64.apk.sha256
            echo
            cat apk-signature.txt
            echo
            cat apk-badging.txt
          } > BUILD_INFO.txt

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoSub-v1.5-large-row-fix-arm64
          path: |
            autosub/AutoSub-v1.5-large-row-fix-arm64.apk
            autosub/AutoSub-v1.5-large-row-fix-arm64.apk.sha256
            autosub/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 1
